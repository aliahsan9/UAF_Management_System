name: .NET CI

on:
  push:
    branches: [ "master", "feature/phase7-testing-quality" ]
    paths:
      - "backend/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "backend/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "Uaf_CI_StrongPassword_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Uaf_CI_StrongPassword_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore with NuGet vulnerability warnings treated as errors
        run: >-
          dotnet restore backend/UAF/UAF.sln
          -p:NuGetAudit=true
          -p:NuGetAuditLevel=moderate
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Report vulnerable direct and transitive packages
        run: dotnet list backend/UAF/UAF.sln package --vulnerable --include-transitive

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build backend/UAF/UAF.sln --configuration Release --no-restore

      - name: Validate EF Core model snapshot when migrations are committed
        shell: bash
        run: |
          migrations_dir="backend/UAF/UAF.Infrastructure/Persistence/Migrations"
          if [ -d "$migrations_dir" ] && find "$migrations_dir" -maxdepth 1 -name '*.cs' -print -quit | grep -q .; then
            dotnet ef migrations has-pending-model-changes \
              --project backend/UAF/UAF.Infrastructure/UAF.Infrastructure.csproj \
              --startup-project backend/UAF/UAF.API/UAF.API.csproj \
              --context UafDbContext
          else
            echo "::warning::No committed EF Core migrations found. Generate, review, and commit the InitialCreate migration before deployment."
          fi

      - name: Test with line and branch coverage
        env:
          UAF_TEST_SQLSERVER_CONNECTION_STRING: "Server=localhost,1433;User Id=sa;Password=Uaf_CI_StrongPassword_2026!;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=true"
        run: |
          mkdir -p backend/UAF/UAF.Tests/TestResults/Coverage
          dotnet test backend/UAF/UAF.sln \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=cobertura \
            -p:CoverletOutput=./TestResults/Coverage/

      - name: Publish coverage summary
        if: always()
        run: python3 scripts/testing/write-coverage-summary.py backend/UAF/UAF.Tests/TestResults/Coverage/coverage.cobertura.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uaf-test-and-coverage-reports
          path: |
            backend/UAF/UAF.Tests/TestResults/**/*.trx
            backend/UAF/UAF.Tests/TestResults/Coverage/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14
