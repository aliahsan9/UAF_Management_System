name: .NET CI

on:
  push:
    branches: [ "master" ]
    paths:
      - "backend/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "backend/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "Uaf_CI_StrongPassword_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Uaf_CI_StrongPassword_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/UAF/UAF.sln

      - name: Build
        run: dotnet build backend/UAF/UAF.sln --configuration Release --no-restore

      - name: Test
        env:
          UAF_TEST_SQLSERVER_CONNECTION_STRING: "Server=localhost,1433;User Id=sa;Password=Uaf_CI_StrongPassword_2026!;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=true"
        run: dotnet test backend/UAF/UAF.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
